name: kapso-platform
label: Kapso (WhatsApp Business API)
kind: platform
version: 0.1.0
author: AutoKing
description: >
  Adaptador de WhatsApp Business API oficial de Meta a través de Kapso.

  Kapso expone un passthrough que espeja la Graph API de Meta, así que este
  adaptador SUBCLASEA el WhatsAppCloudAdapter de Hermes y solo cambia tres
  cosas: la URL base, el header de autenticación (X-API-Key en vez de Bearer)
  y el formato del webhook (eventos de Kapso en vez de entry[].changes[]).

  Agrega además lo que el adaptador Cloud de Hermes NO trae: envío de
  plantillas aprobadas, imprescindible para escribirle a alguien fuera de la
  ventana de conversación de 24 horas (recordatorios de cita, seguimientos
  de venta).

requires_env:
  - name: KAPSO_ENABLED
    description: "Habilitar el adaptador de Kapso"
    prompt: "¿Habilitar Kapso? (true/false)"
    password: false
  - name: KAPSO_API_KEY
    description: "API key de Kapso (hex plano, SIN el prefijo kapso_)"
    prompt: "API key de Kapso"
    password: true
    url: https://app.kapso.ai
  - name: KAPSO_PHONE_NUMBER_ID
    description: "phone_number_id del número de WhatsApp que atiende este perfil"
    prompt: "phone_number_id"
    password: false

optional_env:
  - name: KAPSO_WEBHOOK_SECRET
    description: >
      secret_key del webhook de Kapso. Se usa para verificar la firma
      HMAC-SHA256 de X-Webhook-Signature. SIN esto el endpoint acepta
      cualquier POST — no dejarlo vacío en producción.
    prompt: "Secreto del webhook"
    password: true
  - name: KAPSO_WEBHOOK_PORT
    description: "Puerto del servidor de webhook (default 8091)"
    prompt: "Puerto del webhook"
    password: false
  - name: KAPSO_WEBHOOK_PATH
    description: "Ruta del webhook (default /kapso/webhook)"
    prompt: "Ruta del webhook"
    password: false
  - name: KAPSO_WEBHOOK_HOST
    description: >
      Host del webhook. DEJAR VACÍO: vacío bindea IPv4 e IPv6; poner
      0.0.0.0 bindea solo IPv4 y queda inalcanzable en redes IPv6-only.
    prompt: "Host del webhook (dejar vacío)"
    password: false
  - name: KAPSO_API_VERSION
    description: "Versión de la Graph API que espeja Kapso (default v24.0)"
    prompt: "Versión de la API"
    password: false
  - name: KAPSO_ALLOWED_USERS
    description: "Números permitidos, separados por coma. Vacío + ALLOW_ALL=false bloquea todo."
    prompt: "Usuarios permitidos"
    password: false
  - name: KAPSO_ALLOW_ALL_USERS
    description: >
      Permitir que cualquiera le escriba al agente. En AutoKing va en true:
      el agente atiende público. El agente DEBE estar en sandbox.
    prompt: "¿Permitir a todos? (true/false)"
    password: false
  - name: KAPSO_HOME_CHANNEL
    description: "Número por defecto para entregas de cron y notificaciones"
    prompt: "Canal por defecto"
    password: false
